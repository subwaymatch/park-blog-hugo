<header class="site-header">
  <a href="{{ "/" | relURL }}" class="site-logo" title="Home">
    <img src="{{ "images/park_logo_200.png" | relURL }}" alt="Park" width="72" height="22">
  </a>
  <button id="btn-menu" class="hamburger hamburger--collapse" type="button"
    aria-label="Open menu" aria-controls="menu-overlay" aria-expanded="false">
    <span class="hamburger-box"><span class="hamburger-inner"></span></span>
  </button>
</header>

<nav id="menu-overlay" class="menu-overlay" aria-label="Site menu">
  <ul class="menu-list">
    {{ range site.Menus.main }}
    <li class="menu-item">
      <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    </li>
    {{ end }}
  </ul>
</nav>
